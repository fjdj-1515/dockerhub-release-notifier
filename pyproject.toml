[project]
name = "dockerhub-release-notifier"
version = "0.1.0"
description = "Notify Discord when new versions of Docker Hub images are released"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
dockerhub-release-notifier = "dockerhub_release_notifier:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
